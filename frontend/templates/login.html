<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SRG.ai Login</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}

body{

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0d1117;

    color:white;

    overflow:hidden;
}

/* Background */

.background{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,#2563eb33,transparent 40%),
    radial-gradient(circle at bottom right,#7c3aed33,transparent 40%),
    #0d1117;

    z-index:-1;

}

/* Login Card */

.login-card{

    width:420px;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:20px;

    padding:45px;

    text-align:center;

    box-shadow:0 15px 45px rgba(0,0,0,.4);

}

/* Logo */

.logo{

    width:110px;

    height:110px;

    object-fit:contain;

    margin:auto;
}

h1{

    margin-top:20px;

    font-size:32px;

    font-weight:700;
}

.subtitle{

    color:#9ca3af;

    margin-top:12px;

    line-height:1.7;
}

/* Google Button */

.google-btn{

    width:100%;

    margin-top:40px;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.google-btn:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

}

.google-btn i{

    margin-right:10px;

}

/* Footer */

.footer{

    margin-top:35px;

    color:#9ca3af;

    font-size:13px;

}

/* Loading */

.loading{

    position:fixed;

    inset:0;

    background:#0d1117;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:999;

}

.loading.hidden{

    display:none;

}

.spinner{

    width:60px;

    height:60px;

    border:5px solid #333;

    border-top:5px solid #2563eb;

    border-radius:50%;

    animation:spin 1s linear infinite;

}

@keyframes spin{

0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}

}

.loading p{

    margin-top:25px;

    color:#9ca3af;

}

@media(max-width:500px){

.login-card{

    width:92%;

    padding:30px;

}

}

    </style>

</head>

<body>

<div class="background"></div>

<!-- Loading Screen -->

<div id="loadingScreen" class="loading hidden">

    <div class="spinner"></div>

    <p>Signing in to SRG.ai...</p>

</div>

<!-- Login Card -->

<div class="login-card">

    <img
        class="logo"
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="SRG.ai">

    <h1>SRG.ai</h1>

    <p class="subtitle">

        Electronics • Embedded AI • Robotics • Programming

    </p>

    <button
        id="googleLoginBtn"
        class="google-btn">

        <i class="fa-brands fa-google"></i>

        Continue with Google

    </button>

    <div class="footer">

        By continuing you agree to the Terms of Service
        and Privacy Policy.

    </div>

</div>

<!-- Firebase Authentication -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// ======================================================
// Firebase Configuration
// Replace these values with YOUR Firebase project values
// ======================================================

const firebaseConfig = {

    apiKey: "AIzaSyDaq94z8cbMitDD1Lx4ow2nj1XGClvcHrU",

    authDomain: "srg-ai453.firebaseapp.com",

    projectId: "srg-ai453",

    storageBucket: "srg-ai453.firebasestorage.app",

    messagingSenderId: "493951829340",

    appId: "1:493951829340:web:ad9ff1872d866b622d2d99"

};


// Initialize Firebase

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({

    prompt: "select_account"

});


// ======================================================
// UI Elements
// ======================================================

const loginBtn = document.getElementById("googleLoginBtn");

const loadingScreen = document.getElementById("loadingScreen");


// ======================================================
// Show / Hide Loading
// ======================================================

function showLoading(){

    loadingScreen.classList.remove("hidden");

}

function hideLoading(){

    loadingScreen.classList.add("hidden");

}


// ======================================================
// Google Login
// ======================================================

async function login(){

    try{

        showLoading();

        const result = await signInWithPopup(

            auth,

            provider

        );

        console.log("Logged In:", result.user.displayName);

        window.location.href = "/chat";

    }

    catch(error){

        hideLoading();

        console.error(error);

        alert(error.message);

    }

}

loginBtn.addEventListener(

    "click",

    login

);


// ======================================================
// Already Logged In?
// ======================================================

onAuthStateChanged(auth,(user)=>{

    if(user){

        window.location.href="/chat";

    }

});

</script>

</body>

</html>
